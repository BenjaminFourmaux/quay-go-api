definitions:
  Dto.ActivatingUser:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      is_org_member:
        type: boolean
      is_robot:
        type: boolean
      kind:
        description: '''user'' or ''team'''
        type: string
      name:
        type: string
    type: object
  Dto.AddManifestLabel:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  Dto.Avatar:
    properties:
      color:
        description: hex color code
        type: string
      hash:
        type: string
      kind:
        description: e.g., "user", "org"
        type: string
      name:
        type: string
    type: object
  Dto.CreateMessage:
    properties:
      content:
        type: string
      severity:
        type: string
    type: object
  Dto.CreateOrganization:
    properties:
      name:
        type: string
    type: object
  Dto.CreatePrototype:
    properties:
      activating_user_name:
        type: string
      delegate_kind:
        type: string
      delegate_name:
        type: string
      role:
        type: string
    required:
    - activating_user_name
    - delegate_kind
    - delegate_name
    - role
    type: object
  Dto.CreateRepository:
    properties:
      description:
        type: string
      is_public:
        type: boolean
      kind:
        type: string
      name:
        type: string
      namespace:
        description: Can be null if is a global repo, not organization scoped
        type: string
    type: object
  Dto.CreateRobot:
    properties:
      description:
        type: string
      name:
        type: string
      unstructured_metadata:
        additionalProperties: true
        type: object
    type: object
  Dto.CreateTeam:
    properties:
      description:
        description: Description of the Team can be in Markdown format (optional)
        type: string
      name:
        type: string
      role:
        description: Name of the role ('admin', 'creator' or 'member'. Optional. Default
          'member')
        type: string
    type: object
  Dto.Delegate:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      is_org_member:
        type: boolean
      is_robot:
        type: boolean
      kind:
        description: '''user'' or ''team'''
        type: string
      name:
        type: string
    type: object
  Dto.Manifest:
    properties:
      config_media_type:
        type: string
      digest:
        type: string
      is_manifest_list:
        type: boolean
      layers:
        items:
          $ref: '#/definitions/Dto.ManifestLayer'
        type: array
      manifest_data:
        type: string
    type: object
  Dto.ManifestLabel:
    properties:
      id:
        description: UUID
        type: string
      key:
        type: string
      media_type:
        type: string
      source_type:
        type: string
      value:
        type: string
    type: object
  Dto.ManifestLayer:
    properties:
      author:
        type: string
      blob_digest:
        type: string
      command:
        items:
          type: string
        type: array
      comment:
        type: string
      compressed_size:
        description: In Bytes
        type: integer
      created_datetime:
        type: string
      index:
        type: integer
      is_remote:
        type: boolean
      urls:
        items:
          type: string
        type: array
    type: object
  Dto.Message:
    properties:
      content:
        type: string
      media_type:
        type: string
      severity:
        type: string
      uuid:
        type: string
    type: object
  Dto.Organization:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      invoice_email:
        type: boolean
      invoice_email_address:
        type: string
      is_admin:
        type: boolean
      is_free_account:
        type: boolean
      is_member:
        type: boolean
      name:
        type: string
      tag_expiration_s:
        type: integer
      teams:
        items:
          $ref: '#/definitions/Dto.Team'
        type: array
    type: object
  Dto.OrganizationMember:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      kind:
        type: string
      name:
        type: string
      repositories:
        description: List of member's repository name
        items:
          type: string
        type: array
      teams:
        description: List of member's team name
        items:
          type: string
        type: array
    type: object
  Dto.Prototype:
    properties:
      activating_user:
        $ref: '#/definitions/Dto.ActivatingUser'
      delegate:
        $ref: '#/definitions/Dto.Delegate'
      id:
        description: UUID of the prototype
        type: string
      role:
        type: string
    type: object
  Dto.Repository:
    properties:
      description:
        type: string
      is_public:
        type: boolean
      is_starred:
        type: boolean
      kind:
        description: Image or Application
        type: string
      name:
        description: Image name
        type: string
      namespace:
        type: string
      state:
        type: string
    type: object
  Dto.RepositoryDetails:
    properties:
      can_admin:
        type: boolean
      can_write:
        type: boolean
      description:
        type: string
      is_organization:
        type: boolean
      is_public:
        type: boolean
      is_starred:
        type: boolean
      kind:
        type: string
      name:
        type: string
      namespace:
        type: string
      state:
        type: string
      stats:
        items:
          $ref: '#/definitions/Dto.RepositoryStats'
        type: array
      status_token:
        type: string
      tag_expiration_s:
        type: integer
      tags:
        items:
          $ref: '#/definitions/Dto.RepositoryTag'
        type: array
      trust_enabled:
        type: boolean
    type: object
  Dto.RepositoryPermission:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      isRobot:
        description: Optional fields
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  Dto.RepositoryStats:
    properties:
      count:
        type: integer
      date:
        description: 'In format: yyyy-mm-dd'
        type: string
    type: object
  Dto.RepositoryTag:
    properties:
      last_modified:
        type: string
      manifest_digest:
        type: string
      name:
        type: string
      size:
        description: In bits
        type: integer
    type: object
  Dto.Robot:
    properties:
      created:
        type: string
      description:
        type: string
      last_accessed:
        type: string
      name:
        type: string
      repositories:
        description: List of repository names the robot has access to
        items:
          type: string
        type: array
      token:
        type: string
    type: object
  Dto.SecScanReport:
    properties:
      cves:
        items:
          $ref: '#/definitions/Dto.VulnerabilityCVE'
        type: array
      vulnerabilities:
        $ref: '#/definitions/Dto.Vulnerabilities'
    type: object
  Dto.Tag:
    properties:
      end_ts:
        type: string
      is_manifest_list:
        type: boolean
      last_modified:
        type: string
      manifest_digest:
        type: string
      name:
        type: string
      reversion:
        type: boolean
      size:
        description: In bits
        type: integer
      start_ts:
        type: string
      vulnerabilities:
        allOf:
        - $ref: '#/definitions/Dto.Vulnerabilities'
        description: Additional fields for vulnerability information
    type: object
  Dto.Team:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      can_view:
        type: boolean
      description:
        type: string
      is_synced:
        type: boolean
      members_count:
        description: RepoCount    int    `json:"repo_count"` // Useless?
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  Dto.TeamMember:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      invited:
        type: boolean
      is_robot:
        type: boolean
      kind:
        type: string
      name:
        type: string
    type: object
  Dto.UpdateMessage:
    properties:
      content:
        type: string
      severity:
        type: string
    type: object
  Dto.UpdateOrganization:
    properties:
      email:
        type: string
      invoice_email:
        type: boolean
      invoice_email_address:
        type: string
      tag_expiration_s:
        type: integer
    type: object
  Dto.UpdatePrototype:
    properties:
      role:
        description: Can be one of 'admin', 'write' or 'read'
        type: string
    required:
    - role
    type: object
  Dto.UpdateRepository:
    properties:
      description:
        type: string
    type: object
  Dto.UpdateRepositoryPermission:
    properties:
      role:
        description: 'allowed value: "admin", "write", "read"'
        type: string
    type: object
  Dto.UpdateTag:
    properties:
      expiration:
        description: (If specified) The expiration for the image
        type: integer
      immutable:
        description: (If specified) Whether the tag should be immutable. Write permission
          required to set, admin permission required to unset.
        type: boolean
      manifest_digest:
        description: (If specified) The manifest digest to which the tag should point
        type: string
    type: object
  Dto.UpdateTeam:
    properties:
      description:
        type: string
      role:
        type: string
    type: object
  Dto.UserLogin:
    properties:
      metadata: {}
      service:
        type: string
      service_identifier:
        type: string
    type: object
  Dto.UserMeResponse:
    properties:
      anonymous:
        type: boolean
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      can_create_repo:
        type: boolean
      company:
        type: string
      email:
        type: string
      family_name:
        type: string
      given_name:
        type: string
      has_password_set:
        type: boolean
      invoice_email:
        type: boolean
      invoice_email_address:
        type: string
      is_free_account:
        type: boolean
      is_me:
        type: boolean
      location:
        type: string
      logins:
        items:
          $ref: '#/definitions/Dto.UserLogin'
        type: array
      organizations:
        items:
          $ref: '#/definitions/Dto.UserOrganization'
        type: array
      preferred_namespace:
        type: boolean
      prompts:
        description: AI feature in coming ??
        items:
          type: string
        type: array
      super_user:
        type: boolean
      tag_expiration_s:
        type: integer
      username:
        type: string
      verified:
        type: boolean
    type: object
  Dto.UserOrganization:
    properties:
      avatar:
        $ref: '#/definitions/Dto.Avatar'
      can_create_repo:
        type: boolean
      is_org_admin:
        type: boolean
      name:
        type: string
      preferred_namespace:
        type: boolean
      public:
        type: boolean
    type: object
  Dto.Vulnerabilities:
    properties:
      critical:
        type: integer
      high:
        type: integer
      low:
        type: integer
      medium:
        type: integer
      unspecified:
        type: integer
    type: object
  Dto.VulnerabilityCVE:
    properties:
      affected_packages:
        type: string
      affected_versions:
        type: string
      cve_id:
        type: string
      fixable:
        description: version in witch this vulnerability is fixed, if empty then it
          is not fixable
        type: string
      present_in:
        description: '''layer'' or ''base'''
        type: string
      published_date:
        type: string
      severity_score:
        type: number
    type: object
  Errors.ErrorDetails:
    properties:
      code:
        description: Code is a sting that represents the error code (e.g. "USER_NOT_FOUND",
          "INVALID_INPUT", etc.)
        type: string
      message:
        type: string
    type: object
  Errors.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/Errors.ErrorDetails'
    type: object
info:
  contact: {}
  description: Quay registry API implemented in Go
  title: Quay Go API
  version: "1.0"
paths:
  /api/v1/messages:
    get:
      description: List messages displayed on the quay web app for all user
      parameters:
      - description: 'Filter message by severity (comma separated, accepted values:
          info, warning, error)'
        in: query
        name: severity
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dto.Message'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List messages displayed on the quay web app for all user
      tags:
      - Messages
    post:
      consumes:
      - application/json
      description: Create a new message to displayed on the quay web app for all user
      parameters:
      - description: Message content and severity
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/Dto.CreateMessage'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Dto.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new message to displayed on the quay web app for all user
      tags:
      - Messages
  /api/v1/messages/{uuid}:
    delete:
      description: Delete a message
      parameters:
      - description: UUID of the message to update
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a message
      tags:
      - Messages
    patch:
      consumes:
      - application/json
      description: Update the content or the severity of an existing message displayed
        on the quay web app for all user
      parameters:
      - description: UUID of the message to update
        in: path
        name: uuid
        required: true
        type: string
      - description: Message content and severity
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/Dto.UpdateMessage'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dto.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update the content or the severity of an existing message displayed
        on the quay web app for all user
      tags:
      - Messages
  /api/v1/organization:
    get:
      description: List user's organizations
      parameters:
      - description: Filter organizations by public or private (true/false)
        in: query
        name: is_public
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dto.UserOrganization'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List user's organizations
      tags:
      - Organization
    post:
      consumes:
      - application/json
      description: Create a new organization
      parameters:
      - description: Organization metadata
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/Dto.CreateOrganization'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Dto.Organization'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new organization
      tags:
      - Organization
  /api/v1/organization/{orgname}:
    delete:
      description: Delete an organization
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete an organization
      tags:
      - Organization
    get:
      description: Get details in an organization
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dto.Organization'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get details in an organization
      tags:
      - Organization
    patch:
      consumes:
      - application/json
      description: Update organization details
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: Organization details to change
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/Dto.UpdateOrganization'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dto.Organization'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update organization details
      tags:
      - Organization
  /api/v1/organization/{orgname}/members:
    get:
      description: List organization's members
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dto.OrganizationMember'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List organization's members
      tags:
      - Organization
  /api/v1/organization/{orgname}/prototypes:
    get:
      description: List the existing prototypes for this organization
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dto.Prototype'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List the existing prototypes for this organization
      tags:
      - Prototype
    post:
      consumes:
      - application/json
      description: Create a new permission prototype
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: Prototype metadata
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/Dto.CreatePrototype'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Dto.Prototype'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new permission prototype
      tags:
      - Prototype
  /api/v1/organization/{orgname}/prototypes/{prototypeId}:
    delete:
      description: Delete a repository prototype by its ID
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: ID of the prototype (UUID)
        in: path
        name: prototypeId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a repository prototype by its ID
      tags:
      - Prototype
    get:
      description: Get a repository prototype by its ID
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: ID of the prototype (UUID)
        in: path
        name: prototypeId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dto.Prototype'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a repository prototype by its ID
      tags:
      - Prototype
    patch:
      consumes:
      - application/json
      description: Update permission prototype role
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: ID of the prototype (UUID)
        in: path
        name: prototypeId
        required: true
        type: string
      - description: Prototype details to change
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/Dto.UpdatePrototype'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dto.Prototype'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update permission prototype role
      tags:
      - Prototype
  /api/v1/organization/{orgname}/team:
    get:
      description: List organization's teams with optional filtering
      parameters:
      - description: Name of the organization
        in: path
        name: orgname
        required: true
        type: string
      - description: Filter teams by role name (e.g., 'admin', 'creator', 'member')
        in: query
        name: role
        type: string
      - description: Filter teams by name
        in: query
        name: name
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dto.Team'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Errors.ErrorResponse'
